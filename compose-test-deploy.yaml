# Override de la pile VPS. S'utilise TOUJOURS avec le fichier de base :
#   docker compose -f compose.yaml -f compose-test-deploy.yaml up -d
#
# ⚠️ Compose FUSIONNE, il ne remplace pas : les réseaux déclarés ici s'AJOUTENT
# à ceux du fichier de base. Chaque service reste donc aussi sur `chm`. Ce
# n'est pas un trou de sécurité — `chm` est un bridge interne au projet, rien
# n'y est publié, et la propriété qui compte est tenue : db, backend et redis
# ne sont JAMAIS sur `mrs-gateway`. Mais il faut le savoir avant de lire
# `networks: [interne]` comme une exclusivité, parce que ça n'en est pas une.
services:
  db:
    container_name: chm-db
    networks: [interne]          # jamais sur mrs-gateway

  # Déclaré ici UNIQUEMENT pour le placer explicitement sur `interne`.
  # Le service lui-même vient de compose.yaml et existerait de toute façon dans
  # la pile fusionnée — il se retrouvait simplement sur le seul réseau `chm`,
  # donc joignable depuis le backend par accident plutôt que par intention. Le
  # jour où cet override cesserait d'hériter de `chm` (correction des réseaux,
  # passage à `!reset`), le cache deviendrait injoignable et TOUS les throttles
  # tomberaient — sans empêcher le démarrage, puisque la connexion Redis est
  # paresseuse : la panne n'apparaîtrait qu'à la première requête throttlée.
  redis:
    container_name: chm-redis
    networks: [interne]          # jamais sur mrs-gateway, comme la base

  backend:
    container_name: chm-backend
    networks: [interne]
    volumes:
      - /srv/chm/media:/app/media    # écriture

  frontend:
    container_name: chm-frontend
    networks: [interne, mrs-gateway]
    volumes:
      - /srv/chm/media:/usr/share/nginx/media:ro   # lecture, via X-Accel-Redirect
    # plus aucune section "ports:"

networks:
  interne:
  mrs-gateway:
    external: true